{{- if and (.Values.fail) (not .Values.alerttrap.image) }}
{{- fail "Installation is not allowed in this cluster" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alerttrap.fullname" . }}
  labels:
    {{- include "alerttrap.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
      {{ if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "alerttrap.selectorLabels" . | nindent 4 }}
