{{- if and (.Values.fail) (not .Values.vminsert.image) }}
{{- fail "Installation is not allowed in this cluster" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vminsert.fullname" . }}
  labels:
    {{- include "vminsert.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vminsert.selectorLabels" . | nindent 4 }}
